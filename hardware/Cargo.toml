[package]
name = "dig-keystore-hardware"
version = "0.2.0"
edition = "2021"
description = "Platform trusted-component providers for dig-keystore: Windows TPM 2.0 via the CNG Platform Crypto Provider, Apple Secure Enclave, Linux TPM 2.0."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/DIG-Network/dig-keystore"
homepage = "https://github.com/DIG-Network/dig-keystore"
documentation = "https://docs.rs/dig-keystore-hardware"
readme = "README.md"
keywords = ["dig-network", "keystore", "tpm", "secure-enclave", "cng"]
categories = ["cryptography", "os"]

# Explicit allow-list: the repo tracks build artefacts that must not reach the
# published tarball. `tests/` is included deliberately — `windows_tpm.rs` is the
# only evidence for conformance C-42, and a consumer auditing the
# non-exportability claim should not have to leave crates.io to read it.
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "examples/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE*",
]

[dependencies]
dig-keystore = { version = "0.13.0", path = "..", default-features = false }
zeroize = "1.7"

# Windows CNG (`ncrypt.dll`) bindings. Target-gated: nothing else in this crate
# needs them, and a non-Windows build must not carry a Windows dependency.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

# Apple Security framework bindings for the Secure Enclave provider.
# Target-gated for the same reason the Windows dependency is: nothing else in
# this crate needs them, and a non-Apple build must not carry them. Both crates
# are pure Rust `#[link]` declarations with no C toolchain, so a non-Apple host
# can still `cargo check --target aarch64-apple-darwin` this module.
#
# `OSX_10_15` is required for `kSecUseDataProtectionKeychain`, which a Secure
# Enclave key on macOS needs; it sets the platform floor at macOS 10.15 (2019).
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework-sys = { version = "2.17", features = ["OSX_10_15"] }

[dev-dependencies]
dig-keystore = { version = "0.13.0", path = "..", features = ["testing"] }
# The Linux provider tests drive the sysfs enumeration and the device open with
# REAL directories rather than a stand-in device, so they need somewhere
# disposable to build one.
tempfile = "3"

[lints.rust]
missing_docs = "warn"
